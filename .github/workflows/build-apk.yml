name: Build APK

# Builds an installable Android APK in GitHub's cloud — no Android Studio needed.
# Trigger: push to main, or manually via the "Run workflow" button on the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Diagnostics (versions)
        shell: bash
        run: |
          node -e "
          const fs=require('fs'),path=require('path');const out=[];
          for (const d of fs.readdirSync('node_modules').flatMap(x=>x.startsWith('@')?fs.readdirSync('node_modules/'+x).map(y=>x+'/'+y):[x])) {
            const f=path.join('node_modules',d,'expo-module.config.json'); if(!fs.existsSync(f)) continue;
            const c=fs.readFileSync(f,'utf8'); if(c.includes('publication')) out.push(d+'@'+require('./'+path.join('node_modules',d,'package.json')).version+' '+c.replace(/\s+/g,' ').slice(0,300));
          }
          console.log('::notice title=publication::'+(out.join(' || ')||'none'));"

      - name: Logic & database tests
        run: npm test

      - name: Bundle JavaScript (checks for JS errors early)
        shell: bash
        run: |
          set -o pipefail
          npx expo export --platform android --output-dir /tmp/js-check 2>&1 | tee js-bundle.log || {
            grep -n -i -E "error|unable|cannot|failed|SyntaxError" js-bundle.log | head -n 25 | while IFS= read -r l; do echo "::error title=Metro::${l}"; done
            tail -n 40 js-bundle.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | xargs -0 -I{} echo "::error title=Metro tail::{}"
            exit 1; }

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle-build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          # Surface the real Gradle error as annotations (readable without downloading logs).
          f=gradle-build.log
          [ -f "$f" ] || { echo "::error title=No gradle log::gradle-build.log not found"; exit 0; }
          { grep -n -A 25 "What went wrong" "$f" || tail -n 60 "$f"; } | head -n 80 > err.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle error::${msg}"
          grep -n -E "^e: |error:|FAILURE|Execution failed" "$f" | head -n 30 | while IFS= read -r line; do echo "::error title=Gradle line::${line}"; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
