name: Build APK

# Builds an installable Android APK in GitHub's cloud — no Android Studio needed.
# Trigger: push to main, or manually via the "Run workflow" button on the Actions tab.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Align native module versions with the Expo SDK
        run: npx expo install --fix

      - name: Diagnostics (versions)
        shell: bash
        run: |
          for p in expo expo-modules-autolinking expo-modules-core react-native expo-sqlite expo-file-system expo-notifications expo-crypto @expo/vector-icons; do
            v=$(node -p "require('$p/package.json').version" 2>/dev/null || echo missing); echo "::notice title=ver::$p@$v"; done
          npx expo-modules-autolinking resolve -p android --json > al.json 2>/dev/null || true
          node -e "const j=require('./al.json');(j.modules||[]).forEach((m,i)=>console.log('::notice title=mod'+i+'::'+m.packageName+'@'+m.packageVersion+' pub='+JSON.stringify((m.projects||[]).map(p=>p.publication||null))))" || true

      - name: Logic & database tests
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee ../gradle-build.log

      - name: Report build error
        if: failure()
        shell: bash
        run: |
          # Surface the real Gradle error as annotations (readable without downloading logs).
          f=gradle-build.log
          [ -f "$f" ] || { echo "::error title=No gradle log::gradle-build.log not found"; exit 0; }
          { grep -n -A 25 "What went wrong" "$f" || tail -n 60 "$f"; } | head -n 80 > err.txt
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' err.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle error::${msg}"
          grep -n -E "^e: |error:|FAILURE|Execution failed" "$f" | head -n 30 | while IFS= read -r line; do echo "::error title=Gradle line::${line}"; done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
